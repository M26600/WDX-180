<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Input Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="input-container">
        <label for="message-input">Enter your message:</label>
        
        <div class="input-wrapper">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Type here..."
                pattern="[A-Za-z0-9!@_\-\$\(\)\s]{0,30}"
                required
            >
            <span class="char-counter">0/30 characters</span>
        </div>

        <div class="error-message">Error: Invalid input</div>
    </div>

</body>
</html>
