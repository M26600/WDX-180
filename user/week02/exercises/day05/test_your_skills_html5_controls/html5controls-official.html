<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 CONTROLS OFFICIAL PAGE</title>
</head>
<body>
    <p>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required placeholder="example@domain.com">
</p>

<p>
  <label for="tel">Phone:</label>
  <input type="tel" id="tel" name="tel" placeholder="+(250)792041607">
</p>

<p>
  <label for="date">Birth date:</label>
  <input type="date" id="date" name="date">
</p>

<p>
  <label for="time">Appointment time:</label>
  <input type="time" id="time" name="time">
</p>

<p>
  <label for="number">Quantity (1-10):</label>
  <input type="number" id="number" name="number" min="1" max="10" value="5">
</p>

<p>
  <label for="range">Satisfaction (0-10):</label>
  <input type="range" id="range" name="range" min="0" max="10" value="5">
  <output for="range">5</output> 
</p>

<p>
  <label for="color">Favorite color:</label>
  <input type="color" id="color" name="color" value="#ff0000">
</p>

<p><button type="submit">Submit</button></p>
</body>
</html>
