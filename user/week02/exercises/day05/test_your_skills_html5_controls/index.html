<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <p for="first">
        <label for="number">Enter a number:</label>
        <input type="number" name="change" id="pennies" min="0" max="1" step="0.1">
    </p>
    
     <label for="price">Choose a maximum house price: </label>
<input
  type="range"
  name="price"
  id="price"
  min="1"
  max="10"
  step="1"
  value="9" />
<output class="price-output" for="price"></output>
    <script>
        const price = document.querySelector("#price");
const output = document.querySelector(".price-output");

output.textContent = price.value;

price.addEventListener("input", () => {
  output.textContent = price.value;
});

    </script>

<section>
<label for="rate">Rate:</label>
<input type="range" value="0" min="1" max="5" name="rate" id="rate" step="1"/>
<output class="rate-output"></output>
</section>
<script>
const rate = document.querySelector("#rate");
const rateOutput = document.querySelector(".rate-output");
rateOutput.textContent = rate.value;
rate.addEventListener("input", ()=>{
rateOutput.textContent = rate.value;
});
</script>
<section for="calendar_dates">
    <label for="dates">Choose a date and time for your party: </label>
    <input type="datetime-local" id="party" name="bday">
    <span class="validity"></span>
</section>
<section for="numbers">
    <label for="numbers">Enter a number btn 1 and 5: </label>
    <input type="number" id="numbers" max="5" min="1" step="1"/>
</section>
<section for="month">
    <label for="month">Choose a month:</label>
    <input type="month" id="month" name="month"/>
</section>
</body>
</html>
