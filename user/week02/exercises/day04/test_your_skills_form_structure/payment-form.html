<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST1</title>
</head>
<body>
    <form action="" method="post">
        <h1>Payment Form</h1>
        <p>Please complete all required (*)</p>
        <section>
            <h2>Contact information</h2>
            <fieldset>
                <legend>Title</legend>
                <ul>
                    <li>
                        <label for="title1">
                            <input type="radio" id="title_1" name="title" value="A">Ace
                        </label>
                    </li>
                    <li>
                        <label for="title_2">
                            <input type="radio" id="title_2" name="title" value="B"> King
                        </label>
                    </li>
                    <li>
                        <label for="title_3">
                            <input type="radio" value="C" id="title_3" name="title">Queen
                        </label>
                    </li>
                </ul>
            </fieldset>
            <p>
            <label for="Name">Name *:</label>
            <input type="text" name="user_name" required>
            </p>
            <p>
                <label for="mail">Email *:</label>
                <input type="email" id="mail" name="user_email" required>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="pwd" name="user_password" required>
            </p>
        </section>
        <section>
            <h2>Payment information</h2>
            <p>
            <label for="card">
            <span>Card Type:</span></label>
            <select id="card" name="user-card">
                <option value="visa">Visa</option>
                <option value="mc">Mastercard</option>
                <option value="amex">American Express</option>
            </select>
            </p>
            <p>
                <label>
                    Card number *:
                </label>
                <input type="tel" id="number" name="card_number" required/>
            </p>
            <p>
                <label for="expiration">Expiration date *:</label>
                <input type="text" id="expiration" name="expiration" required 
                placeholder="MM/YY" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$"/>
            </p>
        </section>
        <section>
            <p>
                <button type="submit">Validate the payment</button>
            </p>
        </section>
    </form>
</body>
</html>
