<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favs</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>What is your favorite meal?</legend>
            <ul>
                <li><label for="soup">Soup</label>
                <input type="radio" name="meal" id="soup" value="soup"checked/></li>
                <li><label for="curry">Curry</label>
                <input type="radio" name="meal" id="curry" value="curry"/></li>
                <li><label for="pizza">Pizza</label>
                <input type="radio" name="meal" id="pizza" value="pizza"/></li>
            </ul>
        </fieldset>
        <button type="button">This is an <strong>anonymous button</strong></button>
        <input type="button" value="This is an anonymous button" />
        <input type="image" alt="Click me!" src="my-img.png" width="80" height="30" />
        <input type="file" name="file" id="file" accept="image/*" multiple />
        <input type="file" name="file" id="file" accept="video/*;capture=camcorder" />
    </form>
</body>
</html>
